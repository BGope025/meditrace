version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: meditrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: meditrace
      POSTGRES_PASSWORD: meditracepass
      POSTGRES_DB: meditrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meditrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: